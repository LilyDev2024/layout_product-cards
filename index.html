<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Product cards</title><link rel=stylesheet href=layout_product-cards.f14326b0.css><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap" rel=stylesheet><link href=layout_product-cards.bbff5697.css rel=stylesheet><link href=layout_product-cards.e85d2a13.css rel=stylesheet><body>
    <div class=product-card data-qa=card>
      <div class=product-card__image></div>

      <h1 class=product-card__title>
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h1>
      <p class=product-card__code>Product code: 195434</p>

      <div class=product-card__rating>
        <div class=stars>
          <div class="stars stars--4">
            <div class=stars__star></div>
            <div class=stars__star></div>
            <div class=stars__star></div>
            <div class=stars__star></div>
            <div class=stars__star></div>
          </div>
        </div>
        <p class=product-card__reviews>Reviews: 5</p>
      </div>

      <div class=product-card__price>
        <p class=product-card__price-text>Price:</p>
        <p class=product-card__price-value>$2,199</p>
      </div>

      <div class=product-card__button-container>
        <a class=product-card__button-link data-qa=hover>
          <button class=product-card__button>buy</button>
        </a>
      </div>
    </div>
